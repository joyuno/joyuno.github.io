name: Daily Blog Scraper

on:
  schedule:
    # 매일 밤 23:55 (KST) = UTC 14:55
    - cron: '55 14 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 러너 행업 시 15분 방치 대신 빠르게 실패

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 markdownify

      - name: Run scraper (일시 오류 자동 재시도)
        env:
          # GitHub API 인증(비인증 60회/시 rate limit 방지)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=0
          until python scripts/scraper.py; do
            n=$((n+1)); [ $n -ge 3 ] && echo "3회 연속 실패 — 종료" && exit 1
            echo "일시 오류 — 재시도 $n/3, 30s 후..."; sleep 30
          done

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto: Add scraped posts from $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main || true  # push 경합 방지
          git push
