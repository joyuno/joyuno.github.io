name: Daily Study Guide Generator

on:
  schedule:
    # 매일 밤 00:25 (KST) = UTC 15:25 — Daily Blog Scraper(14:55)와 30분 간격(동시실행/푸시 경합 회피)
    - cron: '25 15 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  generate-study-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 러너 행업 시 15분 방치 대신 빠르게 실패

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run study guide generator (일시 오류 자동 재시도)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          n=0
          until python scripts/study_generator.py; do
            n=$((n+1)); [ $n -ge 3 ] && echo "3회 연속 실패 — 종료" && exit 1
            echo "일시 오류 — 재시도 $n/3, 30s 후..."; sleep 30
          done
